<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Alt Courier: a teal envelope, three curved white arrows fanning out to your alts. -->
  <rect x="0" y="0" width="512" height="512" fill="#15202E"/>
  <!-- the envelope: square-cornered outline and its flap -->
  <rect x="48" y="150" width="300" height="212" fill="none" stroke="#5BE0C8" stroke-width="22"/>
  <polyline points="48,150 198,268 348,150" fill="none" stroke="#5BE0C8" stroke-width="22" stroke-linejoin="miter"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round">
    <!-- up -->
    <path d="M 352,236 Q 424,236 452,132"/>
    <!-- straight on, with a little wave -->
    <path d="M 352,262 C 396,262 404,290 450,290"/>
    <!-- down -->
    <path d="M 352,288 Q 424,288 452,392"/>
  </g>
  <!-- the arrowheads, each turned along its arrow's last stretch -->
  <g fill="#FFFFFF">
    <polygon points="0,0 -40,-26 -40,26" transform="translate(458,108) rotate(-75.5)"/>
    <polygon points="0,0 -40,-26 -40,26" transform="translate(492,290)"/>
    <polygon points="0,0 -40,-26 -40,26" transform="translate(458,416) rotate(75.5)"/>
  </g>
</svg>
