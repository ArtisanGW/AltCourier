<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Alt Courier: a stack of letters, like the game's mail, and one arrow that splits three ways, out to your alts.
       Each letter and the arrow that leaves from it share a pastel color: pink on top, yellow, teal at the bottom. No white. -->
  <rect x="0" y="0" width="512" height="512" fill="#15202E"/>
  <defs>
    <!-- one letter: filled with the background so the ones behind it are hidden; its color is set where it is used -->
    <g id="letter" fill="#15202E" stroke-width="16" stroke-linejoin="round">
      <rect x="44" y="184" width="222" height="150"/>
      <polyline points="44,184 155,266 266,184" fill="none"/>
    </g>
  </defs>
  <use href="#letter" stroke="#F4A7B9" transform="translate(-6,-38)"/>
  <use href="#letter" stroke="#F6D98B" transform="translate(28,0)"/>
  <use href="#letter" stroke="#5BE0C8" transform="translate(-8,38)"/>
  <!-- the arrow, set apart from the letters. It starts as one stripe, as thick as the other lines, made of the three
       colors, with a round end. The stripe goes on until pink and teal have parted from it; only then does yellow
       start as a full line. Pink and teal curve off to 45 degrees up and down; yellow goes straight on.
       Open heads, round ends. -->
  <defs>
    <clipPath id="stripe"><rect x="322" y="248" width="100" height="16" rx="8"/></clipPath>
  </defs>
  <g fill="none" stroke-width="16" stroke-linejoin="round">
    <!-- pink and teal, under the stripe: they come out from under it as they part -->
    <g stroke="#F4A7B9">
      <path d="M 332,256 C 380,256 406,224 430,200 L 474,156"/>
      <polyline points="428,156 474,156 474,202" stroke-linecap="round"/>
    </g>
    <g stroke="#5BE0C8">
      <path d="M 332,256 C 380,256 406,288 430,312 L 474,356"/>
      <polyline points="428,356 474,356 474,310" stroke-linecap="round"/>
    </g>
    <!-- the stripe -->
    <g clip-path="url(#stripe)">
      <path d="M 300,250.5 H 430" stroke="#F4A7B9" stroke-width="5.6"/>
      <path d="M 300,261.5 H 430" stroke="#5BE0C8" stroke-width="5.6"/>
      <path d="M 300,256 H 430" stroke="#F6D98B" stroke-width="6.2"/>
    </g>
    <!-- yellow starts as a full line once the others have parted -->
    <g stroke="#F6D98B">
      <path d="M 392,256 H 486"/>
      <polyline points="453,223 486,256 453,289" stroke-linecap="round"/>
    </g>
  </g>
</svg>
